<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy League - فانتازي الدوري</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        plDark: '#38003c',
                        plGreen: '#00ff85',
                        plPink: '#e90052',
                        plLight: '#ebfff5',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-plDark text-white font-sans min-h-screen flex flex-col">

    <!-- Navbar Header -->
    <header class="bg-[#240028] border-b-4 border-plGreen p-4 shadow-lg">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black text-plGreen tracking-wider">FANTASY LEAGUE</h1>
            <nav class="space-x-4 space-x-reverse text-sm font-bold">
                <a href="#" class="hover:text-plGreen transition">تشكيلتي</a>
                <a href="#" class="hover:text-plGreen transition">الانتقالات</a>
                <a href="#" class="hover:text-plGreen transition">الترتيب</a>
            </nav>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
